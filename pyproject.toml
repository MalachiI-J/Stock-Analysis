[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-scrapper"
version = "0.1.0"
description = "A local Phase 1 stock data foundation and reporting tool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2.0",
  "yfinance>=0.2.0",
  "PyYAML>=6.0.2",
  "plotly>=5.18.0",
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
