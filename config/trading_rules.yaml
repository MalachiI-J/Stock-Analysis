trading_rules_version: "trade-v1"
# Two independent numbers you set directly (see `main.py account-set`) -- not
# derived from portfolio_lots/portfolio_sales. recommend sizes every suggestion
# against these, regardless of what positions (if any) you've separately recorded
# via portfolio-buy/portfolio-sell. account-set enforces a $100 floor on both
# (stock_scrapper.trading.config.MIN_ACCOUNT_DOLLARS) -- below that, cash_reserve
# alone leaves less than min_trade_dollar_amount spendable, so no trade could ever
# size. build_recommendations() lets a single trade cross into the position-weight
# cap and the cash reserve, but only up to min_trade_dollar_amount, and only when
# the account is otherwise too small to afford one at the normal caps -- see the
# comments around max_position_dollars/spendable there. Normal-sized accounts are
# unaffected: the override only ever changes anything below ~$667 (position cap)
# or ~$105 (cash reserve).
account_value: 10000.0
available_cash: 10000.0
max_position_weight: 0.15
cash_reserve: 0.05
max_open_positions: 10
max_trade_dollar_amount: 2000.0
min_trade_dollar_amount: 100.0
max_new_buys_per_run: 3
require_strong_candidate_for_buy: true
# Placeholder for a future, separately-approved auto-execution phase. Left false
# and unused by every command today — recommend never trades, it only reports.
auto_execute: false
